name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install marimo + build tools
        run: pip install marimo build

      - name: Install bedspread (for notebook export)
        run: pip install .

      - name: Build bedspread wheel (served by Pages for micropip)
        run: |
          python -m build --wheel
          mkdir -p _site
          cp dist/*.whl _site/

      - name: Export notebooks to WASM HTML
        run: |
          mkdir -p _site/notebooks
          marimo export html-wasm notebooks/bedspread-viewer.py \
            --output _site/notebooks/bedspread-viewer.html \
            --mode run

      - name: Disable Jekyll (prevent _ files from being stripped)
        run: touch _site/.nojekyll

      - name: Generate index page
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>BedSpread</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
              h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
              p { color: #555; margin-top: 0; }
              ul { padding-left: 1.2rem; }
              li { margin: 0.6rem 0; }
              a { color: #0070f3; }
            </style>
          </head>
          <body>
            <h1>BedSpread</h1>
            <p>Pangenome peak visualization for pangenome graphs.</p>
            <ul>
              <li>
                <a href="notebooks/bedspread-viewer.html"><strong>BedSpread Viewer</strong></a><br>
                Upload a pre-computed <code>.npz</code> graph + BED peak files to explore interactively.
              </li>
              <li>
                <strong>BedSpread Prep</strong> — local CLI script (<code>notebooks/bedspread-prep.py</code>)<br>
                Requires odgi. Converts an <code>.og</code> pangenome graph → viewer-compatible <code>.npz</code>.
                See the <a href="https://github.com/broadinstitute/bedspread">repo README</a> for usage.
              </li>
            </ul>
            <hr>
            <p style="font-size:0.85rem">
              Source: <a href="https://github.com/broadinstitute/bedspread">broadinstitute/bedspread</a>
            </p>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
