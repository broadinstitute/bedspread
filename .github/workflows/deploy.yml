name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install marimo + build tools
        run: pip install marimo build

      - name: Install bedspread (for notebook export)
        run: pip install .

      - name: Build bedspread wheel (served alongside notebooks for micropip)
        run: |
          python -m build --wheel
          mkdir -p _site
          cp dist/*.whl _site/

      - name: Export notebooks to WASM HTML
        run: |
          mkdir -p _site/notebooks
          for nb in notebooks/*.py; do
            name=$(basename "$nb" .py)
            marimo export html-wasm "$nb" \
              --output "_site/notebooks/${name}.html" \
              --mode run
          done

      - name: Generate index page
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>BedSpread</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
              h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
              p { color: #555; margin-top: 0; }
              ul { padding-left: 1.2rem; }
              li { margin: 0.6rem 0; }
              a { color: #0070f3; }
            </style>
          </head>
          <body>
            <h1>BedSpread</h1>
            <p>Pangenome peak visualization for pangenome graphs.</p>
            <ul>
              <li>
                <a href="notebooks/bedspread-viewer.html"><strong>BedSpread Viewer</strong></a><br>
                Upload a pre-computed <code>.npz</code> graph + BED peak files to explore interactively.
              </li>
              <li>
                <a href="notebooks/bedspread-prep.html"><strong>BedSpread Prep</strong></a><br>
                (Requires local marimo + odgi) Convert an <code>.og</code> pangenome graph to a viewer-compatible <code>.npz</code>.
              </li>
            </ul>
            <hr>
            <p style="font-size:0.85rem">
              Source: <a href="https://github.com/broadinstitute/bedspread">broadinstitute/bedspread</a>
            </p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
